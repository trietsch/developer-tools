build-and-test:
  stage: build-and-test
  image: jbergknoff/postgresql-client@sha256:45e175ebb700cfd46e23a610477c3576550055ef40c394e663623946a5eced39
  variables:
    GOOGLE_APPLICATION_CREDENTIALS: "/etc/gcloud-adc.json"
  before_script:
    - touch "$GOOGLE_APPLICATION_CREDENTIALS"
    - cp "$ARTIFACT_REGISTRY_GOOGLE_SERVICE_ACCOUNT" "$GOOGLE_APPLICATION_CREDENTIALS"
  cache:
    paths:
      - .m2/
  script:
    - cat $GOOGLE_APPLICATION_CREDENTIALS
    - |
      env
      if [[ -z "${MAVEN_PROFILE}" ]]; then
        echo "No profile"
      else
        echo "Profile = ${MAVEN_PROFILE}"
      fi
